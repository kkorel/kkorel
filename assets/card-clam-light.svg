<svg xmlns="http://www.w3.org/2000/svg" width="444" height="263" viewBox="0 0 444 263" role="img" aria-labelledby="t d"><title id="t">CLAM</title><desc id="d">CLAM (2nd · IC Hack 2026). A Bash assistant that turns a half-typed command or plain-English request into runnable shell commands. Wraps rm, dd and 7 other risky commands so an LLM vets each call before it runs Works with cloud or local models</desc><style>@font-face{font-family:'kk-inter';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'kk-lmdemi';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'kk-mono';src:url(data:font/woff;base64,) format('woff');}text{font-kerning:normal;}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="0.9" fill="#E3DED2"/></pattern></defs><rect x="0.5" y="0.5" width="443" height="262" rx="14" fill="#FBFAF6" stroke="#E4DFD3"/><rect x="0.5" y="0.5" width="443" height="262" rx="14" fill="url(#dots)"/><text x="30.0" y="52.0" font-family="kk-lmdemi" font-size="23" fill="#16171B">CLAM</text><rect x="279.9" y="35.0" width="134.1" height="22.0" rx="11.0" fill="#E9EDFB"/><text x="287.9" y="50.2" font-family="kk-mono" font-size="12.5" fill="#2643C4">2nd · IC Hack 2026</text><text x="30.0" y="86.0" font-family="kk-inter" font-size="14" fill="#393A40">A Bash assistant that turns a half-typed command or</text><text x="30.0" y="107.0" font-family="kk-inter" font-size="14" fill="#393A40">plain-English request into runnable shell commands.</text><rect x="30.0" y="126.5" width="9.0" height="1.3" rx="0" fill="#2643C4"/><text x="48.0" y="131.0" font-family="kk-inter" font-size="13" fill="#75736C">Wraps rm, dd and 7 other risky commands so an LLM vets</text><text x="48.0" y="150.0" font-family="kk-inter" font-size="13" fill="#75736C">each call before it runs</text><rect x="30.0" y="167.5" width="9.0" height="1.3" rx="0" fill="#2643C4"/><text x="48.0" y="172.0" font-family="kk-inter" font-size="13" fill="#75736C">Works with cloud or local models</text><rect x="30.0" y="211.0" width="42.2" height="22.0" rx="11.0" fill="#F2EFE7"/><text x="38.0" y="226.2" font-family="kk-mono" font-size="12.5" fill="#4A4A50">Bash</text><rect x="78.2" y="211.0" width="42.2" height="22.0" rx="11.0" fill="#F2EFE7"/><text x="86.2" y="226.2" font-family="kk-mono" font-size="12.5" fill="#4A4A50">LLMs</text><path d="M406.0 226.0 L414.0 218.0 M408.5 218.0 L414.0 218.0 L414.0 223.5" stroke="#2643C4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>