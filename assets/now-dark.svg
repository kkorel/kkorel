<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="486" viewBox="0 0 1280 486" role="img"><title>Now: Research Engineer · Oorja; Treasurer &amp; Head of Lectures, Imperial AI Society; Year 3 · MEng Mathematics and Computer Science</title><style>@font-face{font-family:'AJ Mono';font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'AJ Inter';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'AJ Inter';font-weight:400;src:url(data:font/woff;base64,) format('woff')}</style><defs></defs><rect x="0.5" y="0.5" width="1279" height="485" rx="24" fill="#0d0d0d" stroke="#232323"/><text x="48.0" y="62.0" font-family="AJ Mono" font-weight="500" font-size="16" fill="#f2f2f2" letter-spacing="3">NOW</text><line x1="48" y1="90" x2="1232" y2="90" stroke="#2e2e2e"/><rect x="48.5" y="116.5" width="55" height="55" rx="13.44" fill="#0d0d0d" stroke="#343434"/><g transform="translate(48 116) scale(0.56)" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M55 22 L32 56 H50 L45 78 L68 44 H50 Z" fill="#f2f2f2"/></g><text x="132.0" y="140.0" font-family="AJ Inter" font-weight="600" font-size="21" fill="#f2f2f2">Research Engineer · Oorja</text><text x="132.0" y="168.0" font-family="AJ Inter" font-weight="400" font-size="18" fill="#8f8f8f">Peer-to-peer solar trading on India's Digital Energy Grid pilot, and research on a governance layer for multi-agent systems:</text><text x="132.0" y="194.0" font-family="AJ Inter" font-weight="400" font-size="18" fill="#8f8f8f">permissions, escalation and audit trails.</text><line x1="132" y1="230" x2="1232" y2="230" stroke="#2e2e2e" stroke-opacity=".7"/><rect x="48.5" y="242.5" width="55" height="55" rx="13.44" fill="#0d0d0d" stroke="#343434"/><g transform="translate(48 242) scale(0.56)" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="38" r="9"/><circle cx="64" cy="40" r="7"/><path d="M22 72 C22 60 30 54 38 54 C46 54 54 60 54 72 M56 72 C56 62 60 56 66 56 C72 56 78 62 78 72"/></g><text x="132.0" y="266.0" font-family="AJ Inter" font-weight="600" font-size="21" fill="#f2f2f2">Treasurer &amp; Head of Lectures, Imperial AI Society</text><text x="132.0" y="294.0" font-family="AJ Inter" font-weight="400" font-size="18" fill="#8f8f8f">Weekly ML and AI lectures to 150 students, live-coding every model, from an MLP in PyTorch to a transformer built from</text><text x="132.0" y="320.0" font-family="AJ Inter" font-weight="400" font-size="18" fill="#8f8f8f">scratch in NumPy.</text><line x1="132" y1="356" x2="1232" y2="356" stroke="#2e2e2e" stroke-opacity=".7"/><rect x="48.5" y="368.5" width="55" height="55" rx="13.44" fill="#0d0d0d" stroke="#343434"/><g transform="translate(48 368) scale(0.56)" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 30 L80 44 L50 58 L20 44 Z"/><path d="M34 51 V64 C42 72 58 72 66 64 V51 M80 44 V60"/></g><text x="132.0" y="392.0" font-family="AJ Inter" font-weight="600" font-size="21" fill="#f2f2f2">Year 3 · MEng Mathematics and Computer Science</text><text x="132.0" y="420.0" font-family="AJ Inter" font-weight="400" font-size="18" fill="#8f8f8f">First Class Honours in Year 2.</text></svg>